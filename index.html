<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>HangulGo</title>

  <!-- Mobile / PWA 설정 -->
  <meta name="theme-color" content="#58cc02">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HangulGo">
  <meta name="description" content="Learn Hangul the Duolingo way - HangulGo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    :root {
      --primary: #58cc02;
      --primary-dark: #46a302;
      --secondary: #1cb0f6;
      --accent: #ffc800;
      --danger: #ff4b4b;
      --bg: #f7f9fa;
      --card-bg: #ffffff;
      --text: #3c3c3c;
      --gray: #e5e5e5;
      --gray-text: #777777;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Feather', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
    body {
      background-color: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      min-height: 100vh; min-height: 100dvh;
      overscroll-behavior-y: none;
    }

    /* Header Navigation */
    header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--gray);
      position: sticky; top: 0; z-index: 100;
      padding: max(12px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap; row-gap: 8px;
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stats-bar { display: flex; gap: 16px; font-weight: bold; font-size: 0.95rem; }
    .stat-item { display: flex; align-items: center; gap: 6px; background: #f0f0f0; padding: 6px 12px; border-radius: 20px; white-space: nowrap; }

    /* Language Switcher */
    .lang-switcher { position: relative; }
    .lang-btn {
      background: #f0f0f0; border: none; border-radius: 20px;
      padding: 6px 12px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px; color: var(--text);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .lang-menu {
      display: none; position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--card-bg); border: 2px solid var(--gray); border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12); overflow: hidden; z-index: 300;
      min-width: 150px;
    }
    .lang-menu.open { display: block; }
    .lang-option {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: none; padding: 12px 16px; font-size: 0.95rem;
      cursor: pointer; text-align: left; color: var(--text);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .lang-option:hover, .lang-option:active { background: #f0f0f0; }
    .lang-option.active { color: var(--primary); font-weight: bold; }
    .lang-flag { font-size: 1.2rem; }

    /* Main Container */
    main {
      flex: 1; max-width: 800px; width: 100%; margin: 0 auto;
      padding: 20px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    /* Navigation Tabs */
    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top: 2px solid var(--gray);
      display: flex; justify-content: space-around;
      padding: 10px 0 max(10px, env(safe-area-inset-bottom)) 0; z-index: 100;
    }
    .nav-btn {
      background: none; border: none; font-weight: bold; color: var(--gray-text);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.75rem; cursor: pointer; width: 25%;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }

    /* Section Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Buttons */
    .btn {
      background: var(--primary); color: white; border: none;
      padding: 14px 24px; font-size: 1rem; font-weight: bold;
      border-radius: 16px; border-bottom: 4px solid var(--primary-dark);
      cursor: pointer; transition: all 0.1s; width: 100%;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .btn-secondary { background: var(--secondary); border-bottom-color: #1899d6; }
    .btn-accent { background: var(--accent); color: #3c3c3c; border-bottom-color: #e5b200; }

    /* 1. Learn Path (Tree) */
    .path-container { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-top: 20px; }
    .node-card {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--primary); border: 6px solid #e5e5e5;
      display: flex; justify-content: center; align-items: center;
      color: white; font-weight: bold; font-size: 1.2rem;
      box-shadow: 0 6px 0 var(--primary-dark);
      cursor: pointer; position: relative; transition: transform 0.2s;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .node-card:hover { transform: scale(1.05); }
    .node-card.locked { background: var(--gray); box-shadow: 0 6px 0 #cccccc; cursor: not-allowed; }
    .node-card.completed::after { content: '✓'; position: absolute; top: -5px; right: -5px; background: var(--accent); border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; color: black; border: 2px solid white; }
    .node-label { text-align: center; font-weight: bold; margin-top: 8px; font-size: 0.9rem; }

    /* 2. Hangul Alphabet Chart */
    .chart-section { margin-bottom: 24px; }
    .chart-section h3 { margin-bottom: 12px; color: var(--text); border-left: 4px solid var(--primary); padding-left: 8px; }
    .grid-chart { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
    .char-card {
      background: var(--card-bg); border: 2px solid var(--gray); border-radius: 12px;
      padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
      border-bottom: 4px solid var(--gray);
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .char-card:hover { border-color: var(--secondary); background: #e8f7fe; }
    .char-card .symbol { font-size: 1.5rem; font-weight: bold; }
    .char-card .romaja { font-size: 0.75rem; color: var(--gray-text); margin-top: 4px; }

    /* 3. Daily Quests */
    .quest-item {
      background: var(--card-bg); border: 2px solid var(--gray); border-radius: 16px;
      padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px;
    }
    .quest-icon { font-size: 2rem; }
    .quest-info { flex: 1; }
    .quest-title { font-weight: bold; margin-bottom: 4px; }
    .progress-bar { background: var(--gray); height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }

    /* Quiz Modal/Overlay */
    .quiz-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--card-bg); z-index: 200;
      display: none; flex-direction: column; justify-content: space-between;
      max-width: 800px; margin: 0 auto;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      overflow-y: auto;
    }
    .quiz-header { display: flex; align-items: center; gap: 16px; }
    .quiz-progress { flex: 1; background: var(--gray); height: 16px; border-radius: 8px; overflow: hidden; }
    .quiz-progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
    .quiz-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }
    .quiz-prompt { font-size: 1.4rem; font-weight: bold; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .option-btn {
      background: var(--card-bg); border: 2px solid var(--gray); border-bottom: 4px solid var(--gray);
      border-radius: 16px; padding: 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .option-btn.selected { border-color: var(--secondary); background: #ddf4ff; }
    .option-btn:active { transform: scale(0.97); }

    /* Responsive adjustments - 태블릿/작은 화면 */
    @media (max-width: 480px) {
      .grid-chart { grid-template-columns: repeat(4, 1fr); }
      .quiz-options { grid-template-columns: 1fr; }
    }

    /* 초소형 화면 (iPhone SE 등 폭 380px 이하) */
    @media (max-width: 380px) {
      header { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
      .logo { font-size: 1.15rem; }
      .stats-bar { gap: 8px; font-size: 0.8rem; }
      .stat-item { padding: 5px 8px; }
      .lang-btn { padding: 5px 9px; font-size: 0.8rem; }
      main { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
      .node-card { width: 78px; height: 78px; font-size: 1.05rem; }
      .quiz-prompt { font-size: 1.15rem; }
    }

    /* 가로 모드에서 하단 네비/헤더가 화면을 과도하게 차지하지 않도록 */
    @media (max-height: 480px) and (orientation: landscape) {
      header { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 8px; }
      main { padding-top: 12px; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
      nav.bottom-nav { padding-top: 6px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span>🔥</span> HangulGo
    </div>
    <div class="header-right">
      <div class="stats-bar">
        <div class="stat-item" id="streak-stat" title="Study Streak">
          <span>🔥</span> <span id="streak-count">1</span><span id="streak-suffix">&nbsp;Days</span>
        </div>
        <div class="stat-item" id="xp-stat" title="Experience Points">
          <span>⚡</span> <span id="xp-count">0</span> XP
        </div>
      </div>
      <div class="lang-switcher">
        <button class="lang-btn" id="lang-btn" onclick="toggleLangMenu()">
          <span class="lang-flag">🌐</span> <span id="lang-btn-label">EN</span>
        </button>
        <div class="lang-menu" id="lang-menu">
          <button class="lang-option" data-lang="ko" onclick="setLang('ko')"><span class="lang-flag">🇰🇷</span> 한국어</button>
          <button class="lang-option" data-lang="en" onclick="setLang('en')"><span class="lang-flag">🇺🇸</span> English</button>
          <button class="lang-option" data-lang="ja" onclick="setLang('ja')"><span class="lang-flag">🇯🇵</span> 日本語</button>
          <button class="lang-option" data-lang="zh" onclick="setLang('zh')"><span class="lang-flag">🇨🇳</span> 中文</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Areas -->
  <main>
    <!-- View 1: 학습 트리 (Stage Path) -->
    <section id="view-learn" class="view active">
      <h2 id="learn-heading" style="margin-bottom: 16px;">Hangul Learning Path</h2>
      <div class="path-container" id="path-tree">
        <!-- 동적 생성됨 -->
      </div>
    </section>

    <!-- View 2: 한글 문자표 (Hangul Alphabet Chart) -->
    <section id="view-chart" class="view">
      <h2 id="chart-heading" style="margin-bottom: 16px;">Hangul Consonant/Vowel Chart</h2>

      <div class="chart-section">
        <h3 id="consonants-heading">Consonants</h3>
        <div class="grid-chart" id="chart-consonants"></div>
      </div>

      <div class="chart-section">
        <h3 id="vowels-heading">Vowels</h3>
        <div class="grid-chart" id="chart-vowels"></div>
      </div>

      <div class="chart-section">
        <h3 id="words-heading">Example Words</h3>
        <div class="grid-chart" id="chart-words"></div>
      </div>
    </section>

    <!-- View 3: 일일 퀘스트 (Daily Quests) -->
    <section id="view-quests" class="view">
      <h2 id="quests-heading" style="margin-bottom: 16px;">Today's Missions</h2>
      <div id="quest-list">
        <!-- 동적 생성됨 -->
      </div>
    </section>

    <!-- View 4: 일일 테스트 (Daily Quiz) -->
    <section id="view-daily" class="view">
      <div style="background: white; border: 2px solid var(--gray); border-radius: 20px; padding: 24px; text-align: center;">
        <span style="font-size: 3rem;" id="daily-icon">🎯</span>
        <h2 id="daily-heading" style="margin: 12px 0 8px 0;">Daily Hangul Test</h2>
        <p id="daily-desc" style="color: var(--gray-text); margin-bottom: 20px;">Test your skills today with randomly mixed questions and earn a bonus of 100 XP!</p>
        <button class="btn btn-accent" id="daily-btn" onclick="startDailyTest()">Start Today's Test</button>
      </div>
    </section>
  </main>

  <!-- Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchView('learn')">
      <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM3.82 9L12 4.54 20.18 9 12 13.46 3.82 9z"/></svg>
      <span id="nav-learn-label">Learn</span>
    </button>
    <button class="nav-btn" onclick="switchView('chart')">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
      <span id="nav-chart-label">Chart</span>
    </button>
    <button class="nav-btn" onclick="switchView('quests')">
      <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1c2.22-.49 3.93-2.22 4.39-4.64C19.8 10.63 21 8.55 21 6V5c0-1.1-.9-2-2-2z"/></svg>
      <span id="nav-quests-label">Quests</span>
    </button>
    <button class="nav-btn" onclick="switchView('daily')">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      <span id="nav-daily-label">Daily Test</span>
    </button>
  </nav>

  <!-- Quiz Screen (Overlay) -->
  <div id="quiz-overlay" class="quiz-overlay">
    <div class="quiz-header">
      <button onclick="closeQuiz()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">✕</button>
      <div class="quiz-progress">
        <div id="quiz-progress-fill" class="quiz-progress-fill"></div>
      </div>
    </div>

    <div class="quiz-body">
      <div class="quiz-prompt" id="quiz-question">Loading question...</div>
      <button class="btn btn-secondary" id="audio-btn" style="width: auto; padding: 8px 16px;" onclick="playCurrentAudio()">🔊 Listen</button>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <div>
      <button class="btn" id="quiz-submit-btn" onclick="submitAnswer()">Confirm</button>
    </div>
  </div>

    function detectDefaultLang() {
      const saved = localStorage.getItem('hg_lang');
      if (saved && translations[saved]) return saved;
      const nav = (navigator.language || 'en').toLowerCase();
      if (nav.startsWith('ko')) return 'ko';
      if (nav.startsWith('ja')) return 'ja';
      if (nav.startsWith('zh')) return 'zh';
      return 'en';
    }

    /* App State */
    const state = {
      xp: parseInt(localStorage.getItem('hg_xp')) || 0,
      streak: parseInt(localStorage.getItem('hg_streak')) || 1,
      completedLevels: JSON.parse(localStorage.getItem('hg_levels')) || [1],
      dailyProgress: parseInt(localStorage.getItem('hg_daily')) || 0,
      lang: detectDefaultLang()
    };

    function T() { return translations[state.lang]; }

    /* Active Quiz State */
    let currentQuizList = [];
    let currentQuizIdx = 0;
    let selectedOption = null;
    let isDailyTest = false;

    /* Initialize App */
    function init() {
      updateUIHeader();
      renderStaticText();
      renderPathTree();
      renderChart();
      renderQuests();
      document.addEventListener('click', (e) => {
        const switcher = document.querySelector('.lang-switcher');
        if (switcher && !switcher.contains(e.target)) {
          document.getElementById('lang-menu').classList.remove('open');
        }
      });
    }

    /* UI Header Updates */
    function updateUIHeader() {
      document.getElementById('xp-count').innerText = state.xp;
      document.getElementById('streak-count').innerText = state.streak;
      localStorage.setItem('hg_xp', state.xp);
      localStorage.setItem('hg_streak', state.streak);
      localStorage.setItem('hg_levels', JSON.stringify(state.completedLevels));
      localStorage.setItem('hg_daily', state.dailyProgress);
    }

    /* ===================== Language Switching ===================== */
    function toggleLangMenu() {
      document.getElementById('lang-menu').classList.toggle('open');
    }

    function setLang(lang) {
      if (!translations[lang]) return;
      state.lang = lang;
      localStorage.setItem('hg_lang', lang);
      document.getElementById('lang-menu').classList.remove('open');
      renderStaticText();
      renderPathTree();
      renderChart();
      renderQuests();
      // 퀴즈가 열려 있으면 현재 문제도 다시 그리기 (문제 은행이 언어별로 달라짐)
      if (document.getElementById('quiz-overlay').style.display === 'flex') {
        closeQuiz();
      }
    }

    function renderStaticText() {
      const t = T();
      document.documentElement.lang = state.lang;
      document.title = `HangulGo - ${t.tagline}`;

      document.getElementById('lang-btn-label').innerText = t.langBtnLabel;
      document.querySelectorAll('.lang-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === state.lang);
      });

      document.getElementById('streak-suffix').innerText = t.streakSuffix;
      document.getElementById('streak-stat').title = t.streakTitle;
      document.getElementById('xp-stat').title = t.xpTitle;

      document.getElementById('learn-heading').innerText = t.learnHeading;
      document.getElementById('chart-heading').innerText = t.chartHeading;
      document.getElementById('consonants-heading').innerText = t.consonantsLabel;
      document.getElementById('vowels-heading').innerText = t.vowelsLabel;
      document.getElementById('words-heading').innerText = t.wordsLabel;
      document.getElementById('quests-heading').innerText = t.questHeading;

      document.getElementById('daily-icon').innerText = t.dailyIcon;
      document.getElementById('daily-heading').innerText = t.dailyHeading;
      document.getElementById('daily-desc').innerText = t.dailyDesc;
      document.getElementById('daily-btn').innerText = t.dailyBtn;

      document.getElementById('nav-learn-label').innerText = t.nav.learn;
      document.getElementById('nav-chart-label').innerText = t.nav.chart;
      document.getElementById('nav-quests-label').innerText = t.nav.quests;
      document.getElementById('nav-daily-label').innerText = t.nav.daily;

      document.getElementById('audio-btn').innerText = t.listenBtn;
      document.getElementById('quiz-submit-btn').innerText = t.confirmBtn;
    }

    /* Tab Switching */
    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`view-${viewId}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    /* Render Level Tree */
    function renderPathTree() {
      const t = T();
      const container = document.getElementById('path-tree');
      container.innerHTML = '';

      t.levels.forEach((lvl, idx) => {
        const id = idx + 1;
        const isUnlocked = state.completedLevels.includes(id) || id === Math.max(...state.completedLevels) + 1;
        const isCompleted = state.completedLevels.includes(id);

        const node = document.createElement('div');
        node.style.display = 'flex';
        node.style.flexDirection = 'column';
        node.style.alignItems = 'center';

        node.innerHTML = `
          <div class="node-card ${isCompleted ? 'completed' : ''} ${!isUnlocked ? 'locked' : ''}"
               onclick="${isUnlocked ? `startQuiz(${id})` : ''}">
            ${id}
          </div>
          <div class="node-label">${lvl.title}<br><small style="color:var(--gray-text); font-weight:normal;">${lvl.desc}</small></div>
        `;
        container.appendChild(node);
      });
    }

    /* Render Alphabet Chart */
    function renderChart() {
      const t = T();
      const createCards = (data, containerId) => {
        const el = document.getElementById(containerId);
        el.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'char-card';
          card.onclick = () => speakText(item.char);
          card.innerHTML = `<div class="symbol">${item.char}</div><div class="romaja">${item.name}</div>`;
          el.appendChild(card);
        });
      };

      createCards(consonants, 'chart-consonants');
      createCards(vowels, 'chart-vowels');
      createCards(t.words, 'chart-words');
    }

    /* Render Daily Quests */
    function renderQuests() {
      const t = T();
      const container = document.getElementById('quest-list');
      const qProgress = Math.min(state.dailyProgress, 3);

      container.innerHTML = `
        <div class="quest-item">
          <div class="quest-icon">⚡</div>
          <div class="quest-info">
            <div class="quest-title">${t.quest1}</div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${(qProgress/3)*100}%;"></div></div>
          </div>
          <div>${qProgress}/3</div>
        </div>
        <div class="quest-item">
          <div class="quest-icon">🎯</div>
          <div class="quest-info">
            <div class="quest-title">${t.quest2}</div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${state.dailyProgress > 0 ? 100 : 0}%;"></div></div>
          </div>
          <div>${state.dailyProgress > 0 ? t.done : t.notDone}</div>
        </div>
      `;
    }

    /* Text-to-Speech Functionality (항상 한국어 발음으로 재생) */
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* Start Quiz */
    function startQuiz(levelId) {
      isDailyTest = false;
      currentQuizList = [...T().questions].sort(() => 0.5 - Math.random()).slice(0, 3);
      currentQuizIdx = 0;
      openQuizOverlay();
    }

    function startDailyTest() {
      isDailyTest = true;
      currentQuizList = [...T().questions].sort(() => 0.5 - Math.random()).slice(0, 5);
      currentQuizIdx = 0;
      openQuizOverlay();
    }

    function openQuizOverlay() {
      document.getElementById('quiz-overlay').style.display = 'flex';
      loadCurrentQuestion();
    }

    function closeQuiz() {
      document.getElementById('quiz-overlay').style.display = 'none';
    }

    function loadCurrentQuestion() {
      selectedOption = null;
      const q = currentQuizList[currentQuizIdx];

      document.getElementById('quiz-progress-fill').style.width = `${(currentQuizIdx / currentQuizList.length) * 100}%`;
      document.getElementById('quiz-question').innerText = q.q;

      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption = idx;
        };
        optsContainer.appendChild(btn);
      });

      speakText(q.audio);
    }

    function playCurrentAudio() {
      const q = currentQuizList[currentQuizIdx];
      speakText(q.audio);
    }

    function submitAnswer() {
      const t = T();
      if (selectedOption === null) {
        alert(t.selectFirst);
        return;
      }

      const q = currentQuizList[currentQuizIdx];
      if (selectedOption === q.a) {
        alert(t.correct);
      } else {
        alert(t.wrong(q.options[q.a]));
      }

      currentQuizIdx++;

      if (currentQuizIdx >= currentQuizList.length) {
        // Quiz Completed
        const gainedXP = isDailyTest ? 100 : 20;
        state.xp += gainedXP;
        state.dailyProgress += 1;

        if (!isDailyTest && !state.completedLevels.includes(1)) {
          state.completedLevels.push(1);
        }

        updateUIHeader();
        renderPathTree();
        renderQuests();

        alert(t.complete(gainedXP));
        closeQuiz();
      } else {
        loadCurrentQuestion();
      }
    }

    /* Initialize on load */
    window.onload = init;

    /* PWA: 서비스워커 등록 (오프라인 실행 및 "홈 화면에 추가" 지원) */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          /* file:// 로 직접 열었거나 서버가 아닌 경우 등록이 실패할 수 있음 - 앱 동작에는 영향 없음 */
        });
      });
    }
  </script>
